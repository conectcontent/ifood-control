name: Gerar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Gerar Gradle Wrapper e Compilar APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Localizar e Renomear APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK encontrado em: $APK_FILE"
          cp "$APK_FILE" ./Fintech-iFood-Control.apk

      - name: Salvar APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Fintech-iFood-Control-APK
          path: ./Fintech-iFood-Control.apk

      - name: Publicar Release no GitHub com Download Direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Fintech iFood Control v1.0 (APK Android)"
          body: |
            ### 📱 Fintech iFood Control - APK para Android
            
            Clique abaixo para baixar o **Fintech-iFood-Control.apk** e instalar no seu celular!
            
            - **Instalação Nativa**: Não depende de navegador.
            - **24h na Nuvem**: Roda sempre online.
            - **Multi-Usuário**: Sistema de perfis de entregadores.
          files: ./Fintech-iFood-Control.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
