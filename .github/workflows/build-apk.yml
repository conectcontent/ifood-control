name: Gerar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew || true
          gradle assembleRelease --no-daemon || gradle assembleDebug --no-daemon

      - name: Preparar arquivo APK
        run: |
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK encontrado em: $APK_FILE"
          cp "$APK_FILE" ./Fintech-iFood-Control.apk

      - name: Salvar APK como Artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Fintech-iFood-Control-APK
          path: ./Fintech-iFood-Control.apk

      - name: Publicar Release no GitHub com Download Direto
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Fintech iFood Control v1.0 (APK Android)"
          body: |
            ### 📱 Fintech iFood Control - APK para Android
            
            Baixe o arquivo **Fintech-iFood-Control.apk** abaixo diretamente para o seu smartphone Android!
            
            - **Instalação Nativa**: Não depende de navegador.
            - **24h na Nuvem**: Conecta diretamente ao app seguro.
            - **Multi-Usuário**: Suporte a cadastro de perfis.
          files: ./Fintech-iFood-Control.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
