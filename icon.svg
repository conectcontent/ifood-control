<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  
  <!-- Glowing circle background -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="14" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="12"/>

  <!-- Stylized fintech / delivery badge -->
  <path d="M190 280 C190 200 322 200 322 280" fill="none" stroke="#06B6D4" stroke-width="16" stroke-linecap="round"/>
  <path d="M220 280 L256 210 L292 280" fill="none" stroke="#A855F7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="330" r="28" fill="#10B981" filter="url(#glow)"/>
  <circle cx="256" cy="330" r="18" fill="#FFFFFF"/>
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#E2E8F0" text-anchor="middle" letter-spacing="4">FINTECH iFOOD</text>
</svg>
